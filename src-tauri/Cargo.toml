[package]
name = "billing-tracker"
version = "0.1.0"
description = "Auswertung von ProjectForge-Exporten für die Consulting-Abrechnung"
edition = "2024"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "billing_tracker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
calamine = { version = "0.37", features = ["chrono"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4"] }
tauri-plugin-window-state = "2"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
keyring = { version = "3", features = ["windows-native", "linux-native", "apple-native"] }

[dev-dependencies]
rust_xlsxwriter = "0.102"
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros"] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# kein panic = "abort": interne Fehler werden zur Meldung (commands::guard)
strip = true
